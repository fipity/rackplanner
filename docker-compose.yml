services:
  rackplanner:
    build: .
    image: rackplanner:latest
    container_name: rackplanner
    restart: unless-stopped
    ports:
      - "${RACKPLANNER_PORT:-8085}:8085"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data
      # Uncomment to edit catalog/*.json without rebuilding (then POST /api/catalog/reload):
      # - ./catalog:/app/catalog:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
