appId: com.fipity.rackplanner
productName: RackPlanner
copyright: Copyright © RackPlanner contributors
directories:
  output: dist
  buildResources: build

# The server bundle has no runtime dependencies except better-sqlite3, whose
# Node-API prebuilds work in Electron as-is, so nothing needs rebuilding.
npmRebuild: false
files:
  - main.js
  - package.json
  - server/**
  - "!node_modules/better-sqlite3/{deps,src,docs,benchmark}/**"
  - "!node_modules/better-sqlite3/binding.gyp"
  - "!node_modules/node-addon-api/**"
  - "!node_modules/better-sqlite3/prebuilds/{darwin-*,linuxmusl-*,*-arm64}.node"
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/*.node
extraResources:
  - from: resources/web
    to: web
  - from: resources/catalog
    to: catalog
  - from: resources/examples
    to: examples
  - from: resources/icon.png
    to: icon.png

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  files:
    - "!node_modules/better-sqlite3/prebuilds/linux-*.node"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: RackPlanner
  artifactName: RackPlanner-Setup-${version}.exe

linux:
  icon: build/icon.png
  category: Development
  synopsis: Visual home-lab rack designer
  description: Plan network and server racks visually, with detailed device faceplates, cables, power and weight stats.
  maintainer: RackPlanner contributors <noreply@users.noreply.github.com>
  executableName: rackplanner
  syncDesktopName: true
  target:
    - target: deb
      arch: [x64]
  files:
    - "!node_modules/better-sqlite3/prebuilds/win32-*.node"
deb:
  packageName: rackplanner
  artifactName: rackplanner_${version}_amd64.deb
  # Electron's runtime libraries; "t64" names are Ubuntu 24.04+, the others older releases.
  depends:
    - libgtk-3-0t64 | libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0t64 | libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
